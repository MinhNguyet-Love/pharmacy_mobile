name: pharmacy_mobile
description: "Mobile app bản đồ nhà thuốc Việt Nam (Pharmacy Map)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.4.3+1
  shared_preferences: ^2.2.3
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_map_marker_cluster: ^1.3.6
  url_launcher: ^6.3.0
  geolocator: ^14.0.2
  flutter_map_heatmap: ^0.0.8
  image_picker: ^1.2.1
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  open_filex: ^4.7.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  package_info_plus: 8.3.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/pharmacy_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#E91E63"
  adaptive_icon_foreground: "assets/icon/pharmacy_icon.png"

flutter:
  uses-material-design: true